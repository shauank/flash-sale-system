server:
  port: ${SERVER_PORT:8082}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:30}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
spring:
  application:
    name: reservation-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reservation_db}
    username: ${DB_USERNAME:flashsale}
    password: ${DB_PASSWORD:flashsale}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
flashsale:
  failure:
    reservation-delay-ms: ${RESERVATION_DELAY_MS:0}
    reservation-error-percentage: ${RESERVATION_ERROR_PERCENTAGE:0}
logging:
  pattern:
    level: "%5p [reservation-service,corr:%X{correlationId:-},req:%X{requestId:-},order:%X{orderId:-},reservation:%X{reservationId:-},duration:%X{processingDurationMs:-},status:%X{finalStatus:-}]"
