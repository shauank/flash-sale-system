server:
  port: ${SERVER_PORT:8084}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:20}
    accept-count: ${TOMCAT_ACCEPT_COUNT:50}
spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${DB_USERNAME:flashsale}
    password: ${DB_PASSWORD:flashsale}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
flashsale:
  payment:
    delay-ms: ${PAYMENT_DELAY_MS:500}
    failure-percentage: ${PAYMENT_FAILURE_PERCENTAGE:10}
logging:
  pattern:
    level: "%5p [payment-service,corr:%X{correlationId:-},req:%X{requestId:-},order:%X{orderId:-},payment:%X{paymentId:-},duration:%X{processingDurationMs:-},status:%X{finalStatus:-}]"
