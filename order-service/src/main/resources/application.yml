server:
  port: ${SERVER_PORT:8083}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:50}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
spring:
  application:
    name: order-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.flashsale.events
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USERNAME:flashsale}
    password: ${DB_PASSWORD:flashsale}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_COMMAND_TIMEOUT:1s}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
services:
  http:
    connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${HTTP_READ_TIMEOUT_MS:5000}
  product-service:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:8081}
  reservation-service:
    base-url: ${RESERVATION_SERVICE_URL:http://localhost:8082}
  payment-service:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8084}
flashsale:
  redis:
    product-key: ${REDIS_PRODUCT_KEY:product}
  failure:
    after-payment-success-percentage: ${AFTER_PAYMENT_SUCCESS_PERCENTAGE:0}
logging:
  pattern:
    level: "%5p [order-service,corr:%X{correlationId:-},req:%X{requestId:-},order:%X{orderId:-},duration:%X{processingDurationMs:-},status:%X{finalStatus:-}]"
